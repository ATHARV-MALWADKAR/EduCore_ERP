[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "college-erp"
version = "1.0.0"
description = "Production-ready ERP system for educational institutions"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "College ERP Team", email = "team@collegeerp.local"}
]
keywords = ["erp", "education", "college", "fastapi", "reflex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Education",
]

dependencies = [
    # Backend Framework
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",

    # Database
    "sqlalchemy==2.0.23",
    "alembic==1.12.1",
    "pymysql==1.1.0",

    # Authentication & Security
    "python-jose[cryptography]==3.3.0",
    "bcrypt==4.1.1",
    "python-multipart==0.0.6",

    # Frontend
    "reflex==0.3.2",

    # Utilities
    "httpx==0.25.2",
    "python-dotenv==1.0.0",
    "email-validator==2.1.0",

    # Logging & Monitoring
    "python-json-logger==2.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "pytest-httpx==0.26.0",
    "black==23.12.0",
    "isort==5.13.2",
    "flake8==6.1.0",
    "bandit==1.7.5",
    "safety==2.3.5",
    "mypy==1.7.1",
]

e2e = [
    "playwright==1.40.0",
]

all = [
    "college-erp[dev,e2e]",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--cov=backend --cov-report=term-short --cov-report=html"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["backend"]
omit = [
    "backend/app/main.py",
    "backend/alembic/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | venv
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101", "B601"]  # Skip assert_used, paramiko_calls

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
