version: '3.9'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0-alpine
    container_name: college_erp_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-college_erp}
      MYSQL_USER: ${DB_USER:-college_erp_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-college_erp_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docs/schema/college_erp_schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - college_erp_net

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: college_erp_backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-me-in-production}
      DB_TYPE: ${DB_TYPE:-sqlite}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-college_erp_user}
      DB_PASSWORD: ${DB_PASSWORD:-college_erp_password}
      DB_NAME: ${DB_NAME:-college_erp}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      FRONTEND_PORT: ${FRONTEND_PORT:-3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./.env:/app/.env
    networks:
      - college_erp_net
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload

  # Reflex Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: college_erp_frontend
    restart: unless-stopped
    environment:
      REFLEX_ENV: ${APP_ENV:-development}
      API_URL: ${API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
      - "3001:3001"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - college_erp_net
    command: reflex run

volumes:
  mysql_data:
    driver: local

networks:
  college_erp_net:
    driver: bridge
