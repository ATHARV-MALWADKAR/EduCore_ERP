<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}College ERP{% endblock %}</title>
    <!-- Tailwind via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#4f46e5',
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <!-- Custom Styles -->
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/theme.js"></script>
    <style>
        .sidebar-transition {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sidebar-open { transform: translateX(0); }
        .sidebar-closed { transform: translateX(-100%); }
    </style>
</head>
<body class="h-full flex bg-slate-50 dark:bg-slate-900 transition-colors duration-300">
    <!-- Sidebar -->
    <div id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 glass sidebar-transition sidebar-closed lg:sidebar-open lg:static lg:inset-0 border-r border-slate-200 dark:border-slate-800">
        <div class="flex items-center justify-center h-16 px-4 bg-gradient-premium">
            <div class="flex items-center space-x-3">
                <i data-lucide="graduation-cap" class="w-8 h-8 text-white"></i>
                <span class="text-xl font-bold text-white tracking-wide">College ERP</span>
            </div>
        </div>
        <nav class="mt-6 px-4">
            <div class="space-y-2">
                {% block sidebar_links %}
                <!-- Links will be defined in child templates -->
                {% endblock %}
            </div>
        </nav>
    </div>

    <!-- Main content -->
    <div class="flex-1 flex flex-col lg:ml-0 overflow-hidden relative">
        <!-- Abstract Background Shapes for Premium feel -->
        <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-primary/10 rounded-full blur-3xl pointer-events-none hidden dark:block"></div>
        <div class="absolute bottom-[-10%] right-[-5%] w-80 h-80 bg-purple-500/10 rounded-full blur-3xl pointer-events-none hidden dark:block"></div>

        <!-- Topbar -->
        <header class="glass sticky top-0 z-30 shadow-sm">
            <div class="flex items-center justify-between h-16 px-6">
                <div class="flex items-center">
                    <button id="sidebarToggle" class="lg:hidden p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                        <i data-lucide="menu" class="w-6 h-6"></i>
                    </button>
                    <h1 class="ml-4 text-xl font-bold text-slate-900 dark:text-white">{% block page_title %}Dashboard{% endblock %}</h1>
                </div>
                <div class="flex items-center space-x-5">
                    <button id="themeToggle" class="p-2 rounded-full text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all hover:rotate-12">
                        <i data-lucide="sun" class="w-5 h-5 dark:hidden"></i>
                        <i data-lucide="moon" class="w-5 h-5 hidden dark:block"></i>
                    </button>
                    <div class="flex items-center space-x-3 bg-slate-100 dark:bg-slate-800 px-3 py-1.5 rounded-full border border-slate-200 dark:border-slate-700">
                        <div class="w-7 h-7 bg-gradient-premium rounded-full flex items-center justify-center shadow-md">
                            <span class="text-white text-xs font-bold">{{ current_user.email[0].upper() if current_user else 'U' }}</span>
                        </div>
                        <span class="text-sm font-medium text-slate-700 dark:text-slate-300 hidden sm:block">{{ current_user.email if current_user else 'User' }}</span>
                    </div>
                    <button id="logoutBtn" class="p-2 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-full transition-colors" title="Logout">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Page content -->
        <main class="flex-1 overflow-y-auto p-6 lg:p-8 relative z-10">
            {% block content %}
            <!-- Page content goes here -->
            {% endblock %}
        </main>
    </div>

    <!-- Overlay for mobile sidebar -->
    <div id="sidebarOverlay" class="fixed inset-0 z-40 bg-slate-900/50 backdrop-blur-sm lg:hidden hidden transition-opacity"></div>

    <script>
        // Theme management
        function initTheme() {
            if (window.themeManager) {
                window.themeManager.init();
            }
        }

        function toggleTheme() {
            if (window.themeManager) {
                window.themeManager.toggleTheme();
            }
        }

        function updateThemeIcon() {
            if (window.themeManager) {
                const theme = window.themeManager.getSavedTheme();
                const sunIcon = document.querySelector('[data-lucide="sun"]');
                const moonIcon = document.querySelector('[data-lucide="moon"]');
                if (sunIcon && moonIcon) {
                    sunIcon.classList.toggle('hidden', theme === 'dark');
                    moonIcon.classList.toggle('hidden', theme === 'light');
                }
            }
        }

        if (window.themeManager) {
            window.themeManager.onThemeChange(updateThemeIcon);
        }

        // Sidebar management
        function initSidebar() {
            const sidebar = document.getElementById('sidebar');
            const sidebarToggle = document.getElementById('sidebarToggle');
            const sidebarOverlay = document.getElementById('sidebarOverlay');

            function toggleSidebar() {
                const isOpen = sidebar.classList.contains('sidebar-open');
                sidebar.classList.toggle('sidebar-open', !isOpen);
                sidebar.classList.toggle('sidebar-closed', isOpen);
                sidebarOverlay.classList.toggle('hidden', isOpen);
            }

            sidebarToggle.addEventListener('click', toggleSidebar);
            sidebarOverlay.addEventListener('click', toggleSidebar);
        }

        // Logout functionality
        function initLogout() {
            const logoutBtn = document.getElementById('logoutBtn');
            logoutBtn.addEventListener('click', async function() {
                try {
                    await fetch('/api/v1/auth/logout', {method: 'POST'});
                } catch (e) {
                    console.log('Logout endpoint call failed:', e);
                }
                localStorage.removeItem('access_token');
                window.location.href = '/login';
            });
        }

        // Authentication check
        function checkAuth() {
            const token = localStorage.getItem('access_token');
            if (!token) {
                window.location.href = '/login';
                return;
            }
            fetch('/api/v1/auth/me', {
                method: 'GET',
                headers: { 'Authorization': `Bearer ${token}` }
            }).then(response => {
                if (!response.ok) {
                    localStorage.removeItem('access_token');
                    window.location.href = '/login';
                }
            }).catch(() => {
                localStorage.removeItem('access_token');
                window.location.href = '/login';
            });
        }

        // Initialize everything
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
            initTheme();
            initSidebar();
            initLogout();
            lucide.createIcons();
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);
        });
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
